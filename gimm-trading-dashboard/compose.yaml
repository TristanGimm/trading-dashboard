name: gimm-trading
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trading}
      POSTGRES_USER: ${DB_USER:-trading}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - trading_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: 5432
      DB_READ_ONLY: 'false'
      # env_file also contains web settings; do not expose its auth secrets to the worker.
      AUTH_USERNAME: ''
      AUTH_PASSWORD_HASH: ''
      AUTH_SECRET: ''
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      DB_USER: ${DB_USER:-trading}
      DB_NAME: ${DB_NAME:-trading}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      DASHBOARD_TIMEZONE: ${DASHBOARD_TIMEZONE:-Europe/Berlin}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      DB_READ_ONLY: 'true'
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
      caddy_shared:
        aliases: [trading-web]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
    security_opt: [no-new-privileges:true]

networks:
  backend:
    driver: bridge
  caddy_shared:
    external: true
    name: gimmholding-credentials_default

volumes:
  trading_postgres:
