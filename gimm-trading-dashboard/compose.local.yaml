# Standalone local demo: never loads .env or starts the production database/worker.
name: gimm-local-demo
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      AUTH_USERNAME: preview
      AUTH_PASSWORD_HASH: 'scrypt$$6146e63d882e2ecde0dc71e3cea80e2a$$c231ec62e38fd5930a9070ca35798ffad277ef0423224610ed54886b013e8e5b058951e3c8e08b4621d4a4fc97ed8b2a86f6dc1230a07b08cbaaa1cca222e9f2'
      AUTH_SECRET: only-a-local-preview-secret-not-for-real-deployment
      GIMM_DEMO_MODE: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '1'
      DB_USER: preview-only
      DB_NAME: preview-only
      DB_PASSWORD: preview-only
      DB_READ_ONLY: 'true'
      DASHBOARD_TIMEZONE: Europe/Berlin
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
